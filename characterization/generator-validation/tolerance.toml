# Tolerance budget — generator integration-validation gate (Task 44, mo-zstr).
#
# Per-(table, column) absolute tolerances the canonical-capture diff applies.
# Format: crates/moves-snapshot/src/tolerance.rs. Harness:
# crates/moves-calculators/tests/generator_validation/. Two cells are equal
# when |canonical - produced| <= tolerance.
#
# Table keys are the generator OUTPUT-table names (Generator::output_tables),
# NOT canonical-MOVES database paths — the harness diffs under the stable
# scratch name (compare::compare_table re-stamps the canonical table to it).

# Strict by default: every Float64 column must match the canonical capture to
# within 1e-9 absolute unless a row below widens it. A divergence past this
# bound is a port bug to fix before Phase 3's calculators proceed.
default_float_tolerance = 1e-9

# --- Expected divergences -------------------------------------------------
#
# CALIBRATED, not placeholder. The canonical snapshots this budget was waiting
# on have landed (characterization/snapshots, 41 of them), and the numbers
# below are measured over all 532 populated ZoneMonthHour rows rather than
# guessed. Two earlier claims here were wrong and are corrected:
#
# 1. THERE IS NO (5/9) ARTIFACT. Canonical MOVES computes the Fahrenheit-to-
#    Kelvin conversion with the EXACT ratio, not MariaDB's DECIMAL 0.5556.
#    Measured worst absolute deviation from the capture:
#
#      slope            specificHumidity        molWaterFraction
#      exact 5.0/9.0    2.871e-07 (2.2e-08 rel) 4.442e-10 (2.2e-08 rel)
#      0.5556           1.742e-03 (1.3e-04 rel) 2.690e-06 (1.3e-04 rel)
#
#    0.5556 is four orders of magnitude worse. The port's exact ratio is
#    right, and this budget no longer widens anything on its account.
#
# 2. THE REAL DIVERGENCE IS COLUMN WIDTH. County.barometricPressure is a
#    FLOAT (32-bit) column, so MOVES computes with the f32-widened value while
#    a port reading the decimal text 29.095 as f64 does not. meteorology.rs's
#    resolve_county_meteorology now narrows through that column, which is
#    worth 13.2x on both outputs:
#
#      specificHumidity 2.871e-07 -> 2.177e-08     molWaterFraction 4.442e-10 -> 3.367e-11
#
#    ZoneMonthHour.temperature and .relHumidity must NOT be narrowed the same
#    way -- the capture already stores those as widened f32 values, so a
#    second narrowing double-rounds (measured: 2.177e-08 -> 1.617e-06).
#
# What remains after that fix is f64 evaluation noise through a 10^x chain.
# molWaterFraction now needs NO widening at all: its worst is 3.367e-11, 30x
# inside the strict default, so its row is gone. specificHumidity keeps one
# only because the column's magnitude (2.18 to 13.11) puts the same relative
# noise above 1e-9 in absolute terms.
#
# heatIndex keeps the strict default, and that claim IS verified rather than
# assumed: worst |computed - captured| over the same 532 rows is 6.537e-13.
# It reads the dry-bulb temperature and touches neither PH2O nor the pressure.
[tables."ZoneMonthHour"]
# Worst measured 2.177e-08; this is 4.6x that. Tighten it, do not widen it:
# a regression past this bound is a port bug, and the headroom is deliberate
# rather than fitted.
specificHumidity = 1e-7
