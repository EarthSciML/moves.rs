# cargo-deny configuration for the moves.rs workspace.
#
# Run locally with `cargo deny check` after `cargo install cargo-deny`.
# CI runs the same check on every push.

[graph]
all-features = true

[advisories]
version = 2
# Treat yanked crates and unmaintained advisories as warnings; only hard-fail
# on active vulnerabilities. Anything more aggressive turns advisory churn
# into a CI tax that distracts from the port.
yanked = "warn"
# Unmaintained transitive deps with no safe upgrade; ignore to avoid CI churn.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 unmaintained, no safe upgrade; transitive dep of polars-utils" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained, no safe upgrade; transitive dep of parquet" },
    # quick-xml < 0.41 XML-parser DoS pair. The workspace's own quick-xml
    # dependency (moves-runspec, moves-fixture-capture) IS on 0.41, so no
    # RunSpec we parse is exposed. The copy that remains is quick-xml 0.39.4,
    # reached only as:
    #     polars 0.53 -> polars-error -> object_store 0.13.2 -> quick-xml ^0.39
    # object_store first requires quick-xml ^0.41 at 0.14.1, but every polars
    # release through 0.55.2 still pins `object_store = "^0.13.1"`, so the fix
    # is unreachable by any polars bump available today -- verified against the
    # crates.io index, not assumed. Nothing in moves.rs feeds attacker-controlled
    # XML to object_store either: it is pulled in transitively by the
    # polars `ipc` feature (ipc -> new_streaming -> dtype-categorical ->
    # polars-stream -> polars-io/file_cache -> cloud -> http -> object_store)
    # and we never open a cloud object store -- all Parquet/IPC I/O is local.
    # UNBLOCKED BY: a polars release that raises its object_store requirement
    # to >= 0.14.1. Re-check with `cargo tree -i quick-xml@<ver>` and delete
    # both entries when it lands.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 quadratic duplicate-attribute check; only via polars-error -> object_store 0.13.2, which no available polars release lets us move off" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 unbounded NsReader namespace allocation; only via polars-error -> object_store 0.13.2, which no available polars release lets us move off" },
]

[licenses]
version = 2
# moves.rs's own crates are GPL-3.0-or-later (matching upstream EPA MOVES; see
# LICENSE), plus the permissive licenses of the third-party dependency graph.
allow = [
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Multiple versions of the same crate are common in mature dep graphs and
# rarely a real problem; warn so we notice but don't block builds.
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (`{ path = "..." }` without a version)
# get reported as wildcards by cargo-deny; that's the standard workspace
# pattern, so exempt them rather than litter the manifests with version
# pins we don't otherwise use.
allow-wildcard-paths = true
# polars 0.53 pulls older versions of several common crates alongside the
# newer versions used by the rest of the workspace.  Skip the older copies
# so the duplicate warnings don't fire; if polars updates its transitive
# deps these entries can be removed.
skip = [
    { name = "cpufeatures",   version = "=0.2.17" },
    { name = "foldhash",      version = "=0.1.5" },
    { name = "getrandom",     version = "=0.2.17" },
    { name = "getrandom",     version = "=0.3.4" },
    { name = "hashbrown",     version = "=0.15.5" },
    { name = "hashbrown",     version = "=0.16.1" },
    { name = "phf",           version = "=0.11.3" },
    { name = "phf_shared",    version = "=0.11.3" },
    { name = "quick-xml",     version = "=0.39.4" },
    { name = "r-efi",         version = "=5.3.0" },
    { name = "rand",          version = "=0.8.6" },
    { name = "rand",          version = "=0.9.4" },
    { name = "rand_core",     version = "=0.6.4" },
    { name = "rand_core",     version = "=0.9.5" },
    { name = "thiserror",     version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
    { name = "windows-link",  version = "=0.1.3" },
    { name = "windows-sys",   version = "=0.52.0" },
    { name = "windows-sys",   version = "=0.59.0" },
    { name = "wit-bindgen",   version = "=0.51.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
