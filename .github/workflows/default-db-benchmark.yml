# default-DB 3-way benchmark (manual)
#
# Runs the default-DB end-to-end benchmark across the three implementations and
# uploads (optionally commits) a Markdown report comparing runtime, peak memory,
# and numerical fidelity:
#
#   * canonical — EPA MOVES inside characterization/apptainer/canonical-moves.sif
#     (master + 1 worker JVM + MariaDB), wall + process-tree peak RSS.
#   * native    — `moves run --default-db` (InputDataManager + generators + the
#     full calculator chain), wall + single-process peak RSS.
#   * wasm      — the wasm partition data-plane (parquet decode + per-dimension
#     load filter + engine), wall + single-process peak RSS.
#
# Numerical fidelity is the per-fixture max per-pollutant rel_diff vs the
# in-repo canonical snapshots, taken from the two correctness gates
# (default_db_snapshot_diff / default_db_canonical_diff). Canonical is the
# reference (rel_diff ≡ 0). All three read the same movesdb20241112 default DB.
#
# Runs on a GitHub-hosted ubuntu-24.04 runner, same as package-default-db /
# default-db-gate. The canonical SIF (Apptainer + fakeroot) is built/restored by
# the shared `.github/actions/build-sif` composite action (installs Apptainer,
# lifts the ubuntu-24.04 AppArmor unprivileged-userns restriction, caches the
# ~1.1 GB image). The default-DB parquet tree is regenerated from that SIF by
# the orchestrator. Manual only (workflow_dispatch): a cold run can take ~1 h
# (SIF build on cache miss) + the canonical Java MOVES sweep, so it is not wired
# to push/PR triggers.
#
# Disk: the SIF, the regenerated parquet tree (~1 GB), MariaDB datadirs, and the
# cargo target all live on the roomy root disk (/). A free-disk step reclaims
# headroom; the orchestrator drops the intermediate TSV dump after conversion.

name: default-db-benchmark

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: >
          Space-separated fixture subset (e.g. "sample-runspec process-pm-exhaust").
          Empty = all 20 non-vacuous onroad default-DB fixtures.
        required: false
        default: ""
      commit_results:
        description: >
          Commit the report under characterization/audit-results/ back to the
          triggering branch. 'false' = retrieve from the uploaded artifact only.
        required: false
        default: "true"

# A benchmark run is expensive and produces partial results; never cancel.
concurrency:
  group: default-db-benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    name: default-DB 3-way benchmark (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # SIF build on a cache miss (~30-60 min) + canonical Java MOVES (~30-60 s ×
    # 20 fixtures) + native/wasm + both gates. 360 min covers a cold runner.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # Reclaim ~20+ GB on / so the SIF + parquet tree + MariaDB datadirs +
      # cargo target fit alongside each other on the root disk.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry, target/
        uses: Swatinem/rust-cache@v2
        with:
          key: default-db-benchmark

      # Build the release binaries the benchmark drives: the native CLI and the
      # moves-wasm test binary (which carries the profile_run_default_db harness
      # the wasm sweep invokes). Surfaces compile errors before the slow SIF step.
      - name: Build release binaries
        run: |
          cargo build --release -p moves-cli
          cargo test  --release -p moves-wasm --no-run

      # Apptainer + canonical SIF (cache-first). Leaves the image at
      # characterization/apptainer/canonical-moves.sif and lifts the AppArmor
      # userns restriction so apptainer --fakeroot also works for the run sweep.
      - name: Build canonical-MOVES SIF (cache-first)
        uses: ./.github/actions/build-sif

      - name: Run 3-way benchmark
        id: bench
        env:
          # Scratch on the roomy root disk ($GITHUB_WORKSPACE is on /), NOT
          # runner.temp (/mnt, ~14 GB — too small for the parquet tree + a
          # MariaDB datadir). Binaries + SIF are already in place.
          MOVES_BENCH_SCRATCH: ${{ github.workspace }}/.bench-scratch
          SKIP_BUILD: "1"
          FIXTURES: ${{ inputs.fixtures }}
        run: ./characterization/audit/run-3way-benchmark.sh

      - name: Commit and push report
        if: ${{ inputs.commit_results == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add characterization/audit-results/
          if git diff --cached --quiet; then
            echo "No new report to commit."
          else
            git commit -m "benchmark(default-db): 3-way ${{ steps.bench.outputs.timestamp }}"
            git push origin HEAD
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-db-benchmark-${{ steps.bench.outputs.timestamp || 'run' }}
          path: ${{ steps.bench.outputs.report_file || 'characterization/audit-results' }}
          if-no-files-found: warn
          retention-days: 30
